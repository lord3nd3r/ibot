[core]
nick = ibot
host = irc.libera.chat
port = 6697
use_ssl = true
verify_ssl = true
owner = yournick
channels = #yourchannel
prefix = \.
db_filename = ibot.db

# Authentication (uncomment and configure as needed)
# auth_method = sasl
# auth_user = ibot
# auth_password = yourpassword

# Admin list (comma-separated)
# admins = admin1, admin2
# admin_accounts = account1, account2

# Extra plugin directories (comma-separated paths)
# extra = /path/to/sopel-scripts, /path/to/more-plugins

# Plugins to exclude from loading (comma-separated names without .py)
# exclude = plugin1, plugin2

# Only load these plugins (empty = load all)
# enable =

# Flood protection
flood_burst = 4
flood_refill = 1

# Logging
logging_level = INFO

# Auto-reconnect
reconnect_on_disconnect = true
